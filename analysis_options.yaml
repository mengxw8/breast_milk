include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - android/**

# Kotlin/Android XML: from android/, run gradlew.bat :app:lintDebug
# --init-script ../scripts/android-lint.init.gradle (or run ./scripts/check.ps1 from the root).
