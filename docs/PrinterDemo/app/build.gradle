apply plugin: 'com.android.application'apply plugin: 'kotlin-android'apply plugin: 'kotlin-kapt'android {    namespace = "com.posprinter.printdemo"    compileSdk 35    defaultConfig {        applicationId "com.posprinter.printdemo"        minSdkVersion 21        targetSdkVersion 35        versionCode 1        versionName "1.0"        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'    }    applicationVariants.configureEach { variant ->        variant.outputs.configureEach {            outputFileName = "PrinterDemo.apk"        }    }    buildTypes {        release {            minifyEnabled false            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'        }    }    viewBinding {        enabled = true    }    compileOptions {        sourceCompatibility JavaVersion.VERSION_17        targetCompatibility JavaVersion.VERSION_17    }    kotlinOptions {        jvmTarget = "17"    }}dependencies {    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'    implementation 'androidx.appcompat:appcompat:1.6.1'    implementation files("libs/printer-lib-3.5.8.aar")    implementation 'com.google.android.material:material:1.8.0'    implementation "io.reactivex.rxjava3:rxjava:3.1.5"    testImplementation 'junit:junit:4.13.2'    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {        exclude group: 'com.android.support', module: 'support-annotations'    })}